# Copy to .github/workflows/openapi-check.yml in a consuming repository.
# This example uses the published 0.5.1 package. JSON and YAML descriptions both work
# (for YAML, change openapi.json to openapi.yaml below).
name: Check OpenAPI URL templates
on:
  pull_request:
    paths: ['openapi.json', '.github/workflows/openapi-check.yml']
  push:
    paths: ['openapi.json', '.github/workflows/openapi-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the description with the published CLI
        # Exit 0: no errors in supported scope; 1: findings; 2: incomplete/input failure.
        # Keep the CLI exit status. Warnings alone do not fail the job.
        run: npx --yes --package moonbit-uri-template@0.5.1 uri-template openapi openapi.json --json > openapi-report.json 2>&1
      - name: Retain the report, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-report
          path: openapi-report.json
