name: Verify RFC 6570
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install checksummed pinned toolchain
        run: python3 tools/bootstrap.py
      - name: Verify four backends, CLI, project contracts and packaged consumer
        run: npm test
      - name: Collect diagnostic coverage
        run: python3 tools/coverage.py
      - name: Build and test portable release
        run: python3 tools/package_release.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            reports/
            _build/publish/*.zip
            _build/releases/*.zip
            _build/releases/*.tgz
