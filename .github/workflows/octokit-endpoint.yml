name: Verify Octokit endpoint integration
on:
  push:
    paths:
      - 'integrations/octokit-endpoint/**'
      - '.github/workflows/octokit-endpoint.yml'
  pull_request:
    paths:
      - 'integrations/octokit-endpoint/**'
      - '.github/workflows/octokit-endpoint.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Also run one anonymous read-only GitHub GET'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  octokit-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned upstream and adapted client
        if: github.event_name != 'workflow_dispatch' || !inputs.live
        run: python3 integrations/octokit-endpoint/run.py --download
      - name: Verify pinned clients and live read-only request
        if: github.event_name == 'workflow_dispatch' && inputs.live
        run: python3 integrations/octokit-endpoint/run.py --download --live
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: octokit-endpoint
          path: |
            reports/octokit-endpoint.json
            _build/octokit-endpoint/run-*/*.log
