name: Verify native MoonBit client
on:
  push:
    paths:
      - 'integrations/moonbit-github/**'
      - 'tools/verify_native_client.py'
      - 'tools/bootstrap.py'
      - 'toolchain.lock.json'
      - '.github/workflows/native-client.yml'
  pull_request:
    paths:
      - 'integrations/moonbit-github/**'
      - 'tools/verify_native_client.py'
      - 'tools/bootstrap.py'
      - 'toolchain.lock.json'
      - '.github/workflows/native-client.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install checksummed pinned toolchain
        run: python3 tools/bootstrap.py
      - name: Update package index
        run: tools/moon update
      - name: Test independent registry consumer without public API requests
        run: python3 tools/verify_native_client.py
      - name: Upload native-client evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-client-offline
          path: |
            reports/native-client-offline.json
            reports/native-client-offline.log
