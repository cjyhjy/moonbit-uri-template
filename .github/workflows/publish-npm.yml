name: Publish npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install OIDC-capable npm
        run: npm install --global npm@11.19.0
      - name: Check tag and module versions
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const moon = readFileSync('moon.mod', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          assert.equal(moon, pkg.version);
          assert.equal(pkg.name, 'moonbit-uri-template');
          assert.notEqual(pkg.private, true);
          JS
      - name: Install pinned development tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install checksummed pinned toolchain
        run: python3 tools/bootstrap.py
      - name: Verify all backends and clean SDK consumer
        run: npm test
      - name: Publish the verified tarball with provenance
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const report = JSON.parse(readFileSync('reports/sdk-package.json', 'utf8'));
          assert.equal(report.status, 'passed');
          assert.equal(report.artifact, `_build/releases/${pkg.name}-${pkg.version}.tgz`);
          assert.equal(createHash('sha256').update(readFileSync(report.artifact)).digest('hex'), report.sha256);
          execFileSync('npm', ['publish', report.artifact, '--provenance', '--access', 'public'], { stdio: 'inherit' });
          JS
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-evidence
          path: |
            reports/
            _build/releases/*.tgz
